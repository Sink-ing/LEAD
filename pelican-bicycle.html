<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const GX = 370;
  const ROAD_Y = 530;
  const WHEEL_R = 56;
  const GY = ROAD_Y - WHEEL_R;
  const FRONT = 248;
  const BB = { x: 118, y: -12 };
  const CRANK = 26;
  const HIP_NEAR = { x: 104, y: -138 };
  const HIP_FAR = { x: 96, y: -134 };
  const L1 = 80;
  const L2 = 84;
  const SPEED = 250;
  const TILE = 1200;

  const $ = (id) => document.getElementById(id);
  const scene = $("scene");
  const sun = $("sun");
  const rays = $("rays");
  const cloudLayer = $("cloudLayer");
  const islandLayer = $("islandLayer");
  const boatLayer = $("boatLayer");
  const waveLayer = $("waveLayer");
  const beachLayer = $("beachLayer");
  const lane = $("lane");
  const glint = $("glint");
  const shadow = $("shadow");
  const dust = $("dust");
  const bike = $("bike");
  const rearWheel = $("rearWheel");
  const frontMount = $("frontMount");
  const ring = $("ring");
  const wing = $("wing");
  const tail = $("tail");
  const pouchRig = $("pouchRig");
  const fish = $("fish");
  const eye = $("eye");
  const scarf = $("scarf");
  const hint = $("hint");
  const gull1 = $("gull1");
  const gull2 = $("gull2");
  const gull1L = $("gull1L");
  const gull1R = $("gull1R");
  const gull2L = $("gull2L");
  const gull2R = $("gull2R");

  const frontWheel = rearWheel.cloneNode(true);
  frontWheel.removeAttribute("id");
  frontMount.appendChild(frontWheel);

  sun.setAttribute("transform", "translate(1012 118)");

  for (let i = 0; i < 12; i++) {
    const a = (i * Math.PI) / 6;
    const line = document.createElementNS(NS, "line");
    line.setAttribute("x1", (Math.cos(a) * 66).toFixed(1));
    line.setAttribute("y1", (Math.sin(a) * 66).toFixed(1));
    line.setAttribute("x2", (Math.cos(a) * 96).toFixed(1));
    line.setAttribute("y2", (Math.sin(a) * 96).toFixed(1));
    rays.appendChild(line);
  }

  function wavePath(amp, cycles) {
    const k = (Math.PI * 2 * cycles) / TILE;
    let d = "";
    for (let x = 0; x <= TILE; x += 16) {
      const y = Math.sin(k * x) * amp;
      d += (x === 0 ? "M" : " L") + x + " " + y.toFixed(2);
    }
    return d;
  }

  const waveSpecs = [
    { y: 418, amp: 5, cycles: 7, color: "rgba(255,255,255,0.55)", width: 2.4, speed: 0.42 },
    { y: 446, amp: 6, cycles: 5, color: "rgba(255,255,255,0.38)", width: 2.8, speed: 0.62 },
    { y: 472, amp: 4, cycles: 9, color: "rgba(186,230,253,0.45)", width: 2, speed: 0.3 }
  ];
  const waves = waveSpecs.map((spec) => {
    const g = document.createElementNS(NS, "g");
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", wavePath(spec.amp, spec.cycles));
    p.setAttribute("stroke", spec.color);
    p.setAttribute("stroke-width", spec.width);
    g.appendChild(p);
    const p2 = p.cloneNode(true);
    p2.setAttribute("transform", "translate(" + TILE + " 0)");
    g.appendChild(p2);
    g.setAttribute("transform", "translate(0 " + spec.y + ")");
    waveLayer.appendChild(g);
    return { g: g, y: spec.y, speed: spec.speed };
  });

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let paused = reduce;
  let last = 0;
  let time = 0;
  let distance = 0;
  let wheelAngle = 0;
  let crank = 0.4;
  let raf = 0;
  let spawn = 0.05;
  const motes = [];

  function ik(hip, foot) {
    let dx = foot.x - hip.x;
    let dy = foot.y - hip.y;
    let dist = Math.hypot(dx, dy) || 0.001;
    const max = L1 + L2 - 0.2;
    const min = Math.abs(L1 - L2) + 0.2;
    if (dist > max) {
      dx *= max / dist;
      dy *= max / dist;
      dist = max;
    } else if (dist < min) {
      dx *= min / dist;
      dy *= min / dist;
      dist = min;
    }
    const base = Math.atan2(dy, dx);
    const cosA = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
    const bend = Math.acos(Math.max(-1, Math.min(1, cosA)));
    const knees = [bend, -bend].map((delta) => ({
      x: hip.x + Math.cos(base + delta) * L1,
      y: hip.y + Math.sin(base + delta) * L1
    }));
    knees.sort((a, b) => a.y - b.y);
    return knees[0];
  }

  function setLine(id, a, b) {
    const el = $(id);
    el.setAttribute("x1", a.x.toFixed(2));
    el.setAttribute("y1", a.y.toFixed(2));
    el.setAttribute("x2", b.x.toFixed(2));
    el.setAttribute("y2", b.y.toFixed(2));
  }

  function placeLeg(prefix, hip, angle) {
    const foot = {
      x: BB.x + Math.cos(angle) * CRANK,
      y: BB.y + Math.sin(angle) * CRANK
    };
    const knee = ik(hip, foot);
    setLine("thigh" + prefix, hip, knee);
    setLine("shin" + prefix, knee, foot);
    const kneeEl = $("knee" + prefix);
    kneeEl.setAttribute("cx", knee.x.toFixed(2));
    kneeEl.setAttribute("cy", knee.y.toFixed(2));
    const tilt = Math.cos(angle) * 14;
    $("pedal" + prefix).setAttribute("transform", "translate(" + foot.x.toFixed(2) + " " + foot.y.toFixed(2) + ") rotate(" + tilt.toFixed(2) + ")");
    $("foot" + prefix).setAttribute("transform", "translate(" + foot.x.toFixed(2) + " " + (foot.y - 1).toFixed(2) + ") rotate(" + tilt.toFixed(2) + ")");
    const crankLine = $(prefix === "Near" ? "crankNearLine" : "crankFar");
    crankLine.setAttribute("x1", BB.x);
    crankLine.setAttribute("y1", BB.y);
    crankLine.setAttribute("x2", foot.x.toFixed(2));
    crankLine.setAttribute("y2", foot.y.toFixed(2));
  }

  function wrap(offset) {
    return -((offset % TILE) + TILE) % TILE;
  }

  function update(dt) {
    distance += SPEED * dt;
    wheelAngle += (SPEED / WHEEL_R) * dt;
    crank += (SPEED / WHEEL_R) * 0.46 * dt;
    const deg = (wheelAngle * 180) / Math.PI;
    const bob = Math.sin(crank * 2) * 2.3;

    rearWheel.setAttribute("transform", "rotate(" + deg.toFixed(2) + ")");
    frontWheel.setAttribute("transform", "rotate(" + deg.toFixed(2) + ")");
    frontMount.setAttribute("transform", "translate(" + FRONT + " 0)");
    ring.setAttribute("transform", "rotate(" + ((crank * 180) / Math.PI).toFixed(2) + " " + BB.x + " " + BB.y + ")");
    bike.setAttribute("transform", "translate(" + GX + " " + (GY + bob).toFixed(2) + ")");

    placeLeg("Far", HIP_FAR, crank + Math.PI);
    placeLeg("Near", HIP_NEAR, crank);

    const press = (bob + 2.3) / 4.6;
    shadow.setAttribute("transform", "translate(" + (GX + 124) + " " + (ROAD_Y + 8) + ") scale(" + (1 + press * 0.08).toFixed(3) + " " + (1 - press * 0.12).toFixed(3) + ")");

    wing.setAttribute("transform", "rotate(" + (Math.sin(time * 5.4) * 6).toFixed(2) + " 108 -186)");
    tail.setAttribute("transform", "rotate(" + (Math.sin(time * 6.2) * 8).toFixed(2) + " 8 -160)");

    const pouchScale = 1 + Math.sin(time * 7.2) * 0.08;
    pouchRig.setAttribute("transform", "translate(250 -210) scale(1 " + pouchScale.toFixed(3) + ") translate(-250 210)");
    fish.setAttribute("transform", "translate(300 -196) rotate(" + (20 + Math.sin(time * 14) * 18).toFixed(2) + ")");

    const blinkPhase = time % 3.5;
    let sy = 1;
    if (blinkPhase < 0.07) sy = 1 - (blinkPhase / 0.07) * 0.88;
    else if (blinkPhase < 0.15) sy = 0.12 + ((blinkPhase - 0.07) / 0.08) * 0.88;
    eye.setAttribute("transform", "translate(170 -252) scale(1 " + sy.toFixed(3) + ")");

    const y1 = (-206 + Math.sin(time * 7) * 6).toFixed(1);
    const y2 = (-198 + Math.sin(time * 7 + 0.9) * 11).toFixed(1);
    const y3 = (-188 + Math.sin(time * 5.2 + 1.6) * 8).toFixed(1);
    scarf.setAttribute("d", "M122,-214 C98," + y1 + " 68," + y2 + " 34," + y3);

    rays.setAttribute("transform", "rotate(" + (time * 10).toFixed(2) + ")");
    glint.setAttribute("opacity", (0.22 + Math.sin(time * 2.4) * 0.14).toFixed(3));

    cloudLayer.setAttribute("transform", "translate(" + wrap(distance * 0.12).toFixed(2) + " 0)");
    islandLayer.setAttribute("transform", "translate(" + wrap(distance * 0.2).toFixed(2) + " 0)");
    boatLayer.setAttribute("transform", "translate(" + wrap(distance * 0.34).toFixed(2) + " 0)");
    beachLayer.setAttribute("transform", "translate(" + wrap(distance * 0.72).toFixed(2) + " 0)");
    lane.setAttribute("transform", "translate(" + wrap(distance).toFixed(2) + " 0)");
    waves.forEach((wave) => {
      wave.g.setAttribute("transform", "translate(" + wrap(distance * wave.speed).toFixed(2) + " " + wave.y + ")");
    });

    const flap1 = Math.sin(time * 9.5) * 24;
    const flap2 = Math.sin(time * 8 + 1) * 22;
    gull1.setAttribute("transform", "translate(" + (1300 - ((time * 46) % 1500)).toFixed(1) + " " + (118 + Math.sin(time * 0.8) * 10).toFixed(1) + ")");
    gull2.setAttribute("transform", "translate(" + (1500 - ((time * 32 + 400) % 1600)).toFixed(1) + " " + (168 + Math.sin(time * 0.6 + 1) * 8).toFixed(1) + ")");
    gull1L.setAttribute("transform", "rotate(" + flap1.toFixed(2) + ")");
    gull1R.setAttribute("transform", "rotate(" + (-flap1).toFixed(2) + ")");
    gull2L.setAttribute("transform", "rotate(" + flap2.toFixed(2) + ")");
    gull2R.setAttribute("transform", "rotate(" + (-flap2).toFixed(2) + ")");

    spawn -= dt;
    if (spawn <= 0) {
      spawn = 0.06 + Math.random() * 0.08;
      const el = document.createElementNS(NS, "circle");
      el.setAttribute("fill", "#e7d3b4");
      dust.appendChild(el);
      motes.push({
        el: el,
        x: GX + 6 + Math.random() * 14,
        y: ROAD_Y - 2,
        vy: -16 - Math.random() * 22,
        life: 1,
        r: 2 + Math.random() * 2
      });
    }
    for (let i = motes.length - 1; i >= 0; i--) {
      const m = motes[i];
      m.x -= SPEED * 0.55 * dt;
      m.y += m.vy * dt;
      m.life -= dt * 1.35;
      m.r += dt * 7;
      if (m.life <= 0) {
        m.el.remove();
        motes.splice(i, 1);
        continue;
      }
      m.el.setAttribute("cx", m.x.toFixed(1));
      m.el.setAttribute("cy", m.y.toFixed(1));
      m.el.setAttribute("r", m.r.toFixed(1));
      m.el.setAttribute("opacity", (m.life * 0.4).toFixed(3));
    }
  }

  function loop(now) {
    if (!last) last = now;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    time += dt;
    update(dt);
    raf = requestAnimationFrame(loop);
  }

  function setHint() {
    hint.textContent = paused ? "已暂停 · 点击继续" : "点击画面暂停";
  }

  function toggle() {
    if (reduce) return;
    paused = !paused;
    setHint();
    if (paused) {
      cancelAnimationFrame(raf);
    } else {
      last = 0;
      raf = requestAnimationFrame(loop);
    }
  }

  update(0);
  setHint();
  if (!paused) raf = requestAnimationFrame(loop);

  scene.addEventListener("click", toggle);
  window.addEventListener("keydown", (event) => {
    if (event.code === "Space" || event.code === "Enter") {
      event.preventDefault();
      toggle();
    }
  });
})();
</script>
</body>
</html>
